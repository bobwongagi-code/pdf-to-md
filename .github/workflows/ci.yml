name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PADDLEOCR_DOC_PARSING_API_URL: https://example.com/layout-parsing
      PADDLEOCR_ACCESS_TOKEN: dummy-token
      PADDLEOCR_DOC_PARSING_TIMEOUT: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-lock.txt

      - name: Show version
        run: python scripts/vl_caller.py --version

      - name: Verify metadata
        run: python scripts/verify_metadata.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test without API call
        run: python scripts/smoke_test.py --skip-api-test

      - name: Check shell syntax and whitespace
        run: bash -n scripts/run_quick_action.sh && git diff --check
